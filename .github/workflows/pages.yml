name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Build the exact commit that passed the Quality Gate, never whatever
      # landed on master while the gate was running.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build for the /iGEMerDB/ subpath
        run: |
          # public/data/web is generated (gitignored): rebuild shards first.
          npm run build:data
          npx vite build --base=/${GITHUB_REPOSITORY#*/}/
          test -f dist/data/web/core.json
          test -f dist/data/web/manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
