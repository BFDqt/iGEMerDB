name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Build the exact commit that passed the Quality Gate, never whatever
      # landed on master while the gate was running.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build for the /iGEMerDB/ subpath
        run: |
          # public/data/web is generated (gitignored): rebuild shards first.
          npm run build:data
          npx vite build --base=/${GITHUB_REPOSITORY#*/}/
          test -f dist/data/web/core.json
          test -f dist/data/web/manifest.json
          # GitHub Pages has no SPA rewrite: serve the app for unknown paths
          # so deep links and refreshes reach the router.
          cp dist/index.html dist/404.html

      - name: Subpath smoke test (the artifact users will actually get)
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4901 --strictPort             --base=/${GITHUB_REPOSITORY#*/}/ > /tmp/igemerdb-pages-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4901/${GITHUB_REPOSITORY#*/}/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/igemerdb-pages-preview.log
              exit 1
            fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4901/${GITHUB_REPOSITORY#*/} npm run test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
