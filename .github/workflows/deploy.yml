name: Deploy verified release

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Stage, activate & verify
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      # Job-level so the health-check `if:` can read them; secrets cannot be
      # referenced from step-level `if:` expressions (always empty there).
      PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
      PUBLIC_URL_2: ${{ secrets.PUBLIC_URL_2 }}

    steps:
      - name: Download the exact artifact that passed Quality Gate
        uses: actions/download-artifact@v8
        with:
          name: production-dist-${{ github.event.workflow_run.head_sha }}
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/data/web/core.json
          test -f dist/data/web/manifest.json
          printf '%s\n' "$RELEASE_SHA" > dist/.release

      - name: Stage release in Tokyo
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          ARGS: '-rlgoDzvc --delete'
          SOURCE: 'dist/'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: '${{ secrets.REMOTE_PATH }}/releases/${{ env.RELEASE_SHA }}/'
          EXCLUDE: '.git,.github'
          SCRIPT_BEFORE: >-
            mkdir -p '${{ secrets.REMOTE_PATH }}/releases/${{ env.RELEASE_SHA }}'
          SCRIPT_BEFORE_REQUIRED: true

      - name: Stage release in Hong Kong
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          ARGS: '-rlgoDzvc --delete'
          SOURCE: 'dist/'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST_2 }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: '${{ secrets.REMOTE_PATH }}/releases/${{ env.RELEASE_SHA }}/'
          EXCLUDE: '.git,.github'
          SCRIPT_BEFORE: >-
            mkdir -p '${{ secrets.REMOTE_PATH }}/releases/${{ env.RELEASE_SHA }}'
          SCRIPT_BEFORE_REQUIRED: true

      - name: Atomically activate Tokyo release
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          ARGS: '-rlgoDzvc'
          SOURCE: 'dist/.release'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: '${{ secrets.REMOTE_PATH }}/releases/${{ env.RELEASE_SHA }}/'
          SCRIPT_AFTER: |
            set -eu
            root='${{ secrets.REMOTE_PATH }}'
            release="$root/releases/${{ env.RELEASE_SHA }}"
            test -f "$release/index.html"
            if [ -L "$root/current" ]; then readlink "$root/current" > "$root/.previous-release"; fi
            ln -sfn "$release" "$root/.current-next"
            mv -Tf "$root/.current-next" "$root/current"
            test -f "$root/current/data/web/core.json"
          SCRIPT_AFTER_REQUIRED: true

      - name: Atomically activate Hong Kong release
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          ARGS: '-rlgoDzvc'
          SOURCE: 'dist/.release'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST_2 }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: '${{ secrets.REMOTE_PATH }}/releases/${{ env.RELEASE_SHA }}/'
          SCRIPT_AFTER: |
            set -eu
            root='${{ secrets.REMOTE_PATH }}'
            release="$root/releases/${{ env.RELEASE_SHA }}"
            test -f "$release/index.html"
            if [ -L "$root/current" ]; then readlink "$root/current" > "$root/.previous-release"; fi
            ln -sfn "$release" "$root/.current-next"
            mv -Tf "$root/.current-next" "$root/current"
            test -f "$root/current/data/web/core.json"
          SCRIPT_AFTER_REQUIRED: true

      - name: HTTP health checks
        if: ${{ env.PUBLIC_URL != '' && env.PUBLIC_URL_2 != '' }}
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          PUBLIC_URL_2: ${{ secrets.PUBLIC_URL_2 }}
        shell: bash
        run: |
          set -euo pipefail
          for url in "$PUBLIC_URL" "$PUBLIC_URL_2"; do
            curl --fail --location --retry 4 --retry-all-errors \
              --max-time 20 "$url/data/web/manifest.json" >/dev/null
          done

      - name: Roll back both regions if activation or health check fails
        if: failure()
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          ARGS: '-rlgoDzvc'
          SOURCE: 'dist/.release'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: '${{ secrets.REMOTE_PATH }}/'
          SCRIPT_AFTER: |
            set -eu
            root='${{ secrets.REMOTE_PATH }}'
            if [ -s "$root/.previous-release" ]; then
              previous=$(cat "$root/.previous-release")
              test -f "$previous/index.html"
              ln -sfn "$previous" "$root/.rollback-next"
              mv -Tf "$root/.rollback-next" "$root/current"
            fi
          SCRIPT_AFTER_REQUIRED: true

      - name: Roll back Hong Kong region if release failed
        if: failure()
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          ARGS: '-rlgoDzvc'
          SOURCE: 'dist/.release'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST_2 }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          TARGET: '${{ secrets.REMOTE_PATH }}/'
          SCRIPT_AFTER: |
            set -eu
            root='${{ secrets.REMOTE_PATH }}'
            if [ -s "$root/.previous-release" ]; then
              previous=$(cat "$root/.previous-release")
              test -f "$previous/index.html"
              ln -sfn "$previous" "$root/.rollback-next"
              mv -Tf "$root/.rollback-next" "$root/current"
            fi
          SCRIPT_AFTER_REQUIRED: true
