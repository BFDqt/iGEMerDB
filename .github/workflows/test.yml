name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CI: true

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend quality gate
        run: npm run check

      - name: Frontend coverage gate
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Use Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/igem_scraper/requirements.txt

      - name: Install scraper and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/igem_scraper/requirements.txt

      - name: Scraper unit tests
        run: npm run test:scraper

      - name: Validate published snapshot
        run: |
          npm run validate:data
          npm run validate:web-data

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Browser end-to-end smoke test
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/igemerdb-preview.log 2>&1 &
          preview_pid=$!
          serve_pid=""
          trap 'kill "$preview_pid" ${serve_pid:+"$serve_pid"}' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/igemerdb-preview.log
              exit 1
            fi
            sleep 1
          done
          npm run test:e2e
          BASE_URL=http://127.0.0.1:4173 \
            PREMIUM_UI_ARTIFACT_DIR=output/ui-premium \
            python tools/e2e/premium_ui_smoke.py

      - name: Throttled-network release acceptance
        shell: bash
        run: |
          python tools/e2e/serve_dist.py --root dist --port 43180 \
            > /tmp/igemerdb-serve-dist.log 2>&1 &
          serve_pid=$!
          trap 'kill "$serve_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:43180/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/igemerdb-serve-dist.log
              exit 1
            fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:43180 python tools/e2e/release_acceptance.py

      - name: Accessibility axe scan (strict)
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/igemerdb-preview-axe.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/igemerdb-preview-axe.log
              exit 1
            fi
            sleep 1
          done
          npm run test:axe

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: |
            output/e2e/
            output/ui-premium/
            output/final-product/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified production artifact
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: production-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
